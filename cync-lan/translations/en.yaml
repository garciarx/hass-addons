network:
  23779/tcp: Port used for communication with Cync devices
  23778/tcp: Port used for the web interface to export devices (ingress)

configuration:
  secret_key:
    name: Encryption key for cloud token cache
    description: Random string used to encrypt the Cync cloud access token at rest. Required if the exporter is enabled.
  account_username:
    name: Cync Account Username
    description: The email address used for your Cync account
  account_password:
    name: Cync Account Password
    description: The password used for your Cync account
  mqtt_host:
    name: MQTT Host
    description: The hostname or IP address of your MQTT broker
  mqtt_port:
    name: MQTT Port
    description: "The port number for your MQTT broker (default: 1883)"
  mqtt_user:
    name: MQTT User
    description: The username for your MQTT broker
  mqtt_pass:
    name: MQTT Password
    description: The password for your MQTT broker
  mqtt_topic:
    name: Cync MQTT Topic
    description: The MQTT topic for Cync device messages
  debug_log_level:
    name: Debug Logging
    description: "Enable debug level logging (default: false)"
  raw_debug:
    name: Binary Debug Logging
    description: "Enable raw binary debug logging [very verbose] (default: false)"
  mqtt_debug:
    name: MQTT Debug Logging
    description: "Enable debug logging for MQTT messages [cuts down on log spam when off] (default: false)"
  cloud_uplink:
    name: Cloud uplink bridge
    description: "One bridge per home (its multi-way switches, or the home's cloud_uplink list) is relayed to the Cync cloud so the Cync app shows live status. Home Assistant keeps control through all other bridges (default: false)"
  app_proxy:
    name: Relay the Cync app to the cloud
    description: "Relay Cync app connections from your network to the Cync cloud instead of closing them, so the app works on your Wi-Fi (default: false)"
  app_mitm_log:
    name: App MITM Logging
    description: "Log MITM proxy requests from/to all Cync app instances (default: false)"
  app_mitm_console:
    name: App MITM Console
    description: "Show MITM proxy requests from/to all Cync app instances in the log console (default: true)"
  dev_mitm_console:
    name: Device MITM Console
    description: "Show MITM proxy requests from/to all Cync devices in the log console (default: true)"
  cync_cloud_ip:
    name: Cync Cloud IP
    description: "The IP address of the Cync cloud server (default: 34.73.130.191)"
  tuning:
    name: Tunables
    description: Tunables to dial-in command latency and offline detection
    fields:
      tcp_whitelist:
        name: TCP Whitelist
        description: "Comma separated IPs allowed to connect to CyncLAN (default: all). Use it to limit connections to always-on devices"
      command_targets:
        name: Command Targets
        description: "How many connected devices a state change command is sent to (default: 2)"
      max_clients:
        name: Max TCP Clients
        description: "Maximum Wi-Fi Cync devices connected at once, more is not better (default: 8)"
      mesh_refresh_secs:
        name: Mesh Info Refresh (seconds)
        description: "How often every connected device is asked for mesh info again, so bulbs switched off at the wall are marked unavailable. 0 = only ask when a device connects (default: 90)"
